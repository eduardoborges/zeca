name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Acumula os commits semanticos num PR de release (CHANGELOG.md + version.txt).
  # Mergear o PR cria a tag e a release; o job abaixo anexa o app.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp

  build-app:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build and package
        env:
          MARKETING_VERSION: ${{ needs.release-please.outputs.version }}
        run: bash scripts/package-dmg.sh
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ditto -c -k --keepParent build/Build/Products/Release/ZecaAI.app build/ZecaAI.zip
          gh release upload '${{ needs.release-please.outputs.tag_name }}' build/ZecaAI.zip build/ZecaAI.dmg
