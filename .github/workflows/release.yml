name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Acumula os commits semanticos num PR de release (CHANGELOG.md + version.txt).
  # Mergear o PR cria a tag e a release; o job abaixo anexa o app.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp

  build-app:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build app
        run: |
          xcodebuild -project ZecaAI.xcodeproj -scheme ZecaAI -configuration Release build \
            -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=${{ needs.release-please.outputs.version }}
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ditto -c -k --keepParent build/Build/Products/Release/ZecaAI.app build/ZecaAI.zip
          bash scripts/package-dmg.sh build/Build/Products/Release/ZecaAI.app build/ZecaAI.dmg
          gh release upload '${{ needs.release-please.outputs.tag_name }}' build/ZecaAI.zip build/ZecaAI.dmg
