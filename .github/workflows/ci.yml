name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '**.md']
  pull_request:

jobs:
  build:
    # macos-26: o codigo usa APIs do SDK 26 (glassEffect, FoundationModels) atras de #available
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build
        run: |
          xcodebuild -project Zeca.xcodeproj -scheme Zeca -configuration Debug build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
