name: CI

# Valida PRs antes do merge. O build de release fica no CD.
on:
  pull_request:
    paths-ignore: ['site/**', '**.md']

jobs:
  build:
    # macos-26: o codigo usa APIs do SDK 26 (glassEffect, FoundationModels) atras de #available
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build
        run: |
          xcodebuild -project Zeca.xcodeproj -scheme Zeca -configuration Debug build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
