name: CI

# Validates pull requests. Release builds live in CD.
on:
  pull_request:
    paths-ignore: ['site/**', '**.md']

jobs:
  build:
    # macos-26: the code uses SDK 26 APIs (glassEffect, FoundationModels) behind #available
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build
        run: |
          xcodebuild -project Zeca.xcodeproj -scheme Zeca -configuration Debug build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
