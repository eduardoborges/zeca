name: CR

# Continuous Release: accumulates semantic commits into a release PR
# (CHANGELOG.md + version.txt). Merging the PR creates the tag and the
# release, and the published release triggers CD, which attaches the builds.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
