name: CR

# Continuous Release: acumula commits semanticos num PR de release
# (CHANGELOG.md + version.txt). Mergear o PR cria a tag e a release,
# e a release publicada dispara o CD, que anexa os builds.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
